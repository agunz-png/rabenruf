name: Herold Veranstaltung verwerfen

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "ID des Herold-Fundes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  reject:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == 'agunz-png' &&
      startsWith(github.event.issue.title, 'Rabenruf verwerfen:'))
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Veranstaltung dauerhaft verwerfen
        env:
          EVENT_ID: ${{ inputs.event_id }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          if os.environ.get("EVENT_NAME") == "issues":
              fields = dict(
                  line.split("=", 1)
                  for line in os.environ.get("ISSUE_BODY", "").splitlines()
                  if "=" in line
              )
              if fields.get("RABENRUF_HEROLD_ACTION") != "reject":
                  raise SystemExit("Ungültige Herold-Aktion.")
              event_id = fields.get("RABENRUF_EVENT_ID", "").strip()
          else:
              event_id = os.environ["EVENT_ID"].strip()

          if not re.fullmatch(r"[A-Za-z0-9_-]{1,120}", event_id):
              raise SystemExit("Ungültige Herold-ID.")

          try:
              with open("events-rejected.json", "r", encoding="utf-8") as f:
                  rejected = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              rejected = []

          if event_id in rejected:
              print("Veranstaltung ist bereits verworfen.")
              raise SystemExit(0)

          rejected.append(event_id)

          with open("events-rejected.json", "w", encoding="utf-8") as f:
              json.dump(rejected, f, ensure_ascii=False, indent=2)

          print("Dauerhaft verworfen:", event_id)
          PY

      - name: Änderung speichern
        run: |
          git config user.name "Rabenruf Herold"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add events-rejected.json

          if git diff --cached --quiet; then
            echo "Keine Änderung nötig."
          else
            git commit -m "🐦‍⬛ Herold: Veranstaltung verworfen"
            git push
          fi

      - name: GitHub-Anfrage abschliessen
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo agunz-png/rabenruf --reason completed
