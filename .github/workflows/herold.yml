name: Rabenruf Herold

on:

  workflow_dispatch:

  schedule:

    - cron: "15 4 * * *"

permissions:

  contents: write

jobs:

  herold:

    runs-on: ubuntu-latest

    steps:

      - name: Repository laden

        uses: actions/checkout@v4

      - name: Herold vorbereiten

        run: |

          echo "🐦‍⬛ Der Rabenruf-Herold erwacht."

          echo "Suche nach neuen Mittelalter-Veranstaltungen."

          echo "Zeitpunkt: $(date -u)"

      - name: Python vorbereiten

        run: |

          python3 -m pip install --quiet beautifulsoup4

      - name: Deutschland prüfen

        run: |

          python3 - <<'PY'

          import json

          import re

          import urllib.request

          from bs4 import BeautifulSoup

          url = "https://mittelaltermarkt-info.de/mittelaltermaerkte-in-deutschland/"

          req = urllib.request.Request(

              url,

              headers={

                  "User-Agent": "Mozilla/5.0 Rabenruf-Herold/1.0"

              }

          )

          with urllib.request.urlopen(req, timeout=30) as response:

              html = response.read().decode("utf-8", errors="ignore")

          soup = BeautifulSoup(html, "html.parser")

          text = soup.get_text("\n", strip=True)

          pattern = re.compile(

            r'(\d{2}\.\d{2}\.(?:\s*[–-]\s*\d{2}\.\d{2}\.)?\s*2026)\s*,?\s*'

            r'([^\n]+)\n'

            r'([^\n]*\d{5}[^\n]*)',

            re.MULTILINE
        
          )
 
          funde = []

          for datum, rest, ortzeile in pattern.findall(text):

              rest = re.sub(r'\s+', ' ', rest).strip()

              if not rest:

                  continue

              teile = [x.strip() for x in rest.split(",") if x.strip()]

              name = teile[0] if teile else rest

              ort_match = re.search(r'\b\d{5}\s+(.+)', ortzeile)

              city = ort_match.group(1).split(",")[0].strip() if ort_match else ""

              city = re.sub(r'\s+', ' ', city)
              
              funde.append({

                  "id": "de-" + str(len(funde) + 1),

                  "name": name[:120],

                  "date": datum.strip(),

                  "city": city[:80],

                  "country": "Deutschland",

                  "source": url

              })

          with open("herold-funde.json", "w", encoding="utf-8") as f:

              json.dump(

                  funde[:50],

                  f,

                  ensure_ascii=False,

                  indent=2

              )

          print("Gefundene Kandidaten:", len(funde))

          PY
          
      - name: Mittelalterkalender Europa prüfen
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime

          url = "https://www.mittelalterkalender.info/mittelaltermarkt/mittelaltermaerkte-europa.php"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          html = urllib.request.urlopen(req, timeout=30).read().decode(
              "utf-8", errors="ignore"
          )

          with open("herold-funde.json", "r", encoding="utf-8") as f:
              funde = json.load(f)

          # Tabellenzeilen suchen
          rows = re.findall(
              r"<tr[^>]*>(.*?)</tr>",
              html,
              flags=re.I | re.S
          )

          neue_funde = []

          for row in rows:
              cells = re.findall(
                  r"<td[^>]*>(.*?)</td>",
                  row,
                  flags=re.I | re.S
              )

              if len(cells) < 3:
                  continue

              clean = []
              for cell in cells:
                  text = re.sub(r"<[^>]+>", " ", cell)
                  text = text.replace("&nbsp;", " ")
                  text = re.sub(r"\s+", " ", text).strip()
                  clean.append(text)

              text = " | ".join(clean)

              # Nur Zeilen mit Datum übernehmen
              datum = re.search(
                  r"(\d{1,2}\.\d{1,2}\.20\d{2})",
                  text
              )

              if not datum:
                  continue

              name = clean[2] if len(clean) > 2 else "Mittelalterveranstaltung"
              city = clean[-1] if clean else ""

              # Land erkennen
              country = ""

              if "Schweiz" in text:
                  country = "Schweiz"
              elif "Deutschland" in text:
                  country = "Deutschland"
              elif "Österreich" in text or "Oesterreich" in text:
                  country = "Österreich"

              fund_id = "mittelalterkalender-" + re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  (name + "-" + city + "-" + datum.group(1)).lower()
              ).strip("-")

              if any(f.get("id") == fund_id for f in funde):
                  continue

              neue_funde.append({
                  "id": fund_id,
                  "name": name,
                  "type": "Markt",
                  "date": datum.group(1),
                  "country": country,
                  "city": city,
                  "source": url
              })

          funde.extend(neue_funde)

          with open("herold-funde.json", "w", encoding="utf-8") as f:
              json.dump(funde, f, ensure_ascii=False, indent=2)

          print("Mittelalterkalender neue Funde:", len(neue_funde))
          print("Herold-Funde insgesamt:", len(funde))
          PY 
      
      - name: Funddatei prüfen

        run: |

          if [ ! -f herold-funde.json ]; then

            echo "[]" > herold-funde.json

          fi

          echo "herold-funde.json ist bereit."

          cat herold-funde.json

      - name: Vergangene Herold-Funde entfernen
        run: |
          python3 - <<'PY'
          import json
          from datetime import date

          with open("herold-funde.json", "r", encoding="utf-8") as f:
              funde = json.load(f)

          heute = date.today().isoformat()
          vorher = len(funde)

          funde = [
              fund for fund in funde
              if (fund.get("end") or fund.get("start") or "9999-12-31") >= heute
          ]

          with open("herold-funde.json", "w", encoding="utf-8") as f:
              json.dump(funde, f, ensure_ascii=False, indent=2)

          print("Vergangene Funde entfernt:", vorher - len(funde))
          print("Verbleibende Funde:", len(funde))
          PY
          
      - name: Änderungen speichern

        run: |

          git config user.name "Rabenruf Herold"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add herold-funde.json

          if git diff --cached --quiet; then

            echo "Keine neuen Funde."

          else

            git commit -m "🐦‍⬛ Herold: neue Funde"

            git push

          fi
