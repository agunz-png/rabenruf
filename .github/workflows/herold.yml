name: Rabenruf Herold

on:

  workflow_dispatch:

  schedule:

    - cron: "15 4 * * *"

permissions:

  contents: write

jobs:

  herold:

    runs-on: ubuntu-latest

    steps:

      - name: Repository laden

        uses: actions/checkout@v4

      - name: Herold vorbereiten

        run: |

          echo "🐦‍⬛ Der Rabenruf-Herold erwacht."

          echo "Suche nach neuen Mittelalter-Veranstaltungen."

          echo "Zeitpunkt: $(date -u)"

      - name: Python vorbereiten

        run: |

          python3 -m pip install --quiet beautifulsoup4

      - name: Deutschland prüfen

        run: |

          python3 - <<'PY'

          import json

          import re

          import urllib.request

          from bs4 import BeautifulSoup

          url = "https://mittelaltermarkt-info.de/mittelaltermaerkte-in-deutschland/"

          req = urllib.request.Request(

              url,

              headers={

                  "User-Agent": "Mozilla/5.0 Rabenruf-Herold/1.0"

              }

          )

          with urllib.request.urlopen(req, timeout=30) as response:

              html = response.read().decode("utf-8", errors="ignore")

          soup = BeautifulSoup(html, "html.parser")

          text = soup.get_text("\n", strip=True)

          pattern = re.compile(

            r'(\d{2}\.\d{2}\.(?:\s*[–-]\s*\d{2}\.\d{2}\.)?\s*2026)\s*,?\s*'

            r'([^\n]+)\n'

            r'([^\n]*\d{5}[^\n]*)',

            re.MULTILINE
        
          )
 
          funde = []

          for datum, rest, ortzeile in pattern.findall(text):

              rest = re.sub(r'\s+', ' ', rest).strip()

              if not rest:

                  continue

              teile = [x.strip() for x in rest.split(",") if x.strip()]

              name = teile[0] if teile else rest

              ort_match = re.search(r'\b\d{5}\s+(.+)', ortzeile)

              city = ort_match.group(1).split(",")[0].strip() if ort_match else ""

              city = re.sub(r'\s+', ' ', city)
              
              funde.append({

                  "id": "de-" + str(len(funde) + 1),

                  "name": name[:120],

                  "date": datum.strip(),

                  "city": city[:80],

                  "country": "Deutschland",

                  "source": url

              })

          with open("herold-funde.json", "w", encoding="utf-8") as f:

              json.dump(

                  funde[:50],

                  f,

                  ensure_ascii=False,

                  indent=2

              )

          print("Gefundene Kandidaten:", len(funde))

          PY
      - name: Buhurt prüfen

        run: |

          python3 - <<'PY'

          import json

          import re

          import urllib.request

          from datetime import datetime

          from bs4 import BeautifulSoup

          basis = "https://www.buhurtinternational.com"

          url = basis + "/tournaments"

          def laden(url):

              req = urllib.request.Request(

                  url,

                  headers={"User-Agent": "Mozilla/5.0 Rabenruf-Herold"}

              )

              with urllib.request.urlopen(req, timeout=30) as response:

                  return response.read().decode("utf-8", errors="ignore")

          html = laden(url)

          soup = BeautifulSoup(html, "html.parser")

          links = []

          for link in soup.find_all("a", href=True):

              href = link.get("href", "")

              if "/tournament/" not in href:

                  continue

              if href.startswith("/"):

                  href = basis + href

              if href not in links:

                  links.append(href)

          with open("herold-funde.json", "r", encoding="utf-8") as f:

              funde = json.load(f)

          for href in links:

              try:

                  detail_html = laden(href)

                  detail = BeautifulSoup(detail_html, "html.parser")

                  text = detail.get_text("\n", strip=True)

                  slug = href.rstrip("/").split("/")[-1]

                  name = slug.replace("-", " ").title()

                  name = re.sub(r"\bV\b$", "V", name)

                  land_match = re.search(

                      r'Country\s*\n+\s*([^\n]+)',

                      text,

                      re.IGNORECASE

                  )

                  start_match = re.search(

                      r'start date:\s*\n+\s*([^\n]+)',

                      text,

                      re.IGNORECASE

                  )

                  end_match = re.search(

                      r'end date:\s*\n+\s*([^\n]+)',

                      text,

                      re.IGNORECASE

                  )

                  country = land_match.group(1).strip() if land_match else ""

                  start_raw = start_match.group(1).strip() if start_match else ""

                  end_raw = end_match.group(1).strip() if end_match else ""

                  start = ""

                  end = ""

                  if start_raw:

                      try:

                          start = datetime.strptime(

                              start_raw,

                              "%B %d, %Y"

                          ).strftime("%Y-%m-%d")

                      except:

                          pass

                  if end_raw:

                      try:

                          end = datetime.strptime(

                              end_raw,

                              "%B %d, %Y"

                          ).strftime("%Y-%m-%d")

                      except:

                          pass

                  if not name or not start:

                      continue

                  if any(f.get("source") == href for f in funde):

                      continue

                  funde.append({

                      "id": "buhurt-" + str(len(funde) + 1),

                      "name": name[:120],

                      "date": start_raw if start_raw == end_raw else start_raw + " – " + end_raw,

                      "start": start,

                      "end": end,

                      "city": "",

                      "country": country,

                      "type": "Buhurt",

                      "source": href

                  })

                  print("Buhurt gefunden:", name, country, start)

              except Exception as e:

                  print("Buhurt-Seite übersprungen:", href, e)

          with open("herold-funde.json", "w", encoding="utf-8") as f:

              json.dump(funde, f, ensure_ascii=False, indent=2)

          print("Funde nach Buhurt-Suche:", len(funde))

          PY


