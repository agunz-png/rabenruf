name: Rabenruf Herold

on:

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - herold_europa.py
      - herold_weitere_quellen.py
      - .github/workflows/herold.yml

  schedule:

    - cron: "15 4 * * *"

permissions:

  contents: write

jobs:

  herold:

    runs-on: ubuntu-latest

    steps:

      - name: Repository laden

        uses: actions/checkout@v4

      - name: Herold vorbereiten

        run: |

          echo "🐦‍⬛ Der Rabenruf-Herold erwacht."

          echo "Suche nach neuen Mittelalter-Veranstaltungen."

          echo "Zeitpunkt: $(date -u)"

      - name: Python vorbereiten

        run: |

          python3 -m pip install --quiet beautifulsoup4

      - name: Deutschland prüfen

        run: |

          python3 - <<'PY'

          import json

          import re

          import urllib.request

          from bs4 import BeautifulSoup

          url = "https://mittelaltermarkt-info.de/mittelaltermaerkte-in-deutschland/"

          req = urllib.request.Request(

              url,

              headers={

                  "User-Agent": "Mozilla/5.0 Rabenruf-Herold/1.0"

              }

          )

          with urllib.request.urlopen(req, timeout=30) as response:

              html = response.read().decode("utf-8", errors="ignore")

          soup = BeautifulSoup(html, "html.parser")

          text = soup.get_text("\n", strip=True)

          pattern = re.compile(

            r'(\d{2}\.\d{2}\.(?:\s*[–-]\s*\d{2}\.\d{2}\.)?\s*2026)\s*,?\s*'

            r'([^\n]+)\n'

            r'([^\n]*\d{5}[^\n]*)',

            re.MULTILINE
        
          )
 
          funde = []

          for datum, rest, ortzeile in pattern.findall(text):

              rest = re.sub(r'\s+', ' ', rest).strip()

              if not rest:

                  continue

              teile = [x.strip() for x in rest.split(",") if x.strip()]

              name = teile[0] if teile else rest

              ort_match = re.search(r'\b\d{5}\s+(.+)', ortzeile)

              city = ort_match.group(1).split(",")[0].strip() if ort_match else ""

              city = re.sub(r'\s+', ' ', city)
              
              funde.append({

                  "id": "de-" + str(len(funde) + 1),

                  "name": name[:120],

                  "date": datum.strip(),

                  "city": city[:80],

                  "country": "Deutschland",

                  "source": url

              })

          with open("herold-funde.json", "w", encoding="utf-8") as f:

              json.dump(

                  funde[:50],

                  f,

                  ensure_ascii=False,

                  indent=2

              )

          print("Gefundene Kandidaten:", len(funde))

          PY
          
      - name: Mittelalterkalender Europa prüfen
        run: |
          python3 herold_europa.py
      
      - name: Weitere Europa-Quellen prüfen
        run: |
          python3 herold_weitere_quellen.py

      - name: Buhurt-Turniere Europa prüfen
        run: |
          python3 herold_buhurt.py

      - name: Funddatei prüfen

        run: |

          if [ ! -f herold-funde.json ]; then

            echo "[]" > herold-funde.json

          fi

          echo "herold-funde.json ist bereit."

          cat herold-funde.json

      - name: Vergangene Herold-Funde entfernen
        run: |
          python3 - <<'PY'
          import json
          import re
          from datetime import date

          path = "herold-funde.json"
          today = date.today()
          with open(path, encoding="utf-8") as handle:
              events = json.load(handle)

          def iso_date(value):
              text = str(value or "").strip()
              if re.fullmatch(r"20\d{2}-\d{2}-\d{2}", text):
                  try:
                      return date.fromisoformat(text)
                  except ValueError:
                      return None
              return None

          def event_dates(event):
              start = iso_date(event.get("start"))
              end = iso_date(event.get("end"))
              if start and not end:
                  end = start
              if not start or not end:
                  label = str(event.get("date") or "")
                  match = re.search(
                      r"(\d{1,2})\.(\d{1,2})\.\s*(?:[–—-]\s*(\d{1,2})\.(\d{1,2})\.)?\s*(20\d{2})",
                      label,
                  )
                  if match:
                      d1, m1, d2, m2, year = match.groups()
                      try:
                          start = date(int(year), int(m1), int(d1))
                          end = date(int(year), int(m2 or m1), int(d2 or d1))
                      except ValueError:
                          return None, None
              return start, end

          kept = []
          past_count = 0
          invalid_count = 0
          for event in events:
              start, end = event_dates(event)
              if not start or not end:
                  invalid_count += 1
                  continue
              if end < today:
                  past_count += 1
                  continue
              event["start"] = start.isoformat()
              event["end"] = end.isoformat()
              kept.append(event)

          with open(path, "w", encoding="utf-8") as handle:
              json.dump(kept, handle, ensure_ascii=False, indent=2)

          print("Vergangene Funde entfernt:", past_count)
          print("Funde ohne gültiges Datum entfernt:", invalid_count)
          print("Verbleibende Funde:", len(kept))
          PY
      - name: Änderungen speichern

        run: |

          git config user.name "Rabenruf Herold"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add herold-funde.json

          if git diff --cached --quiet; then

            echo "Keine neuen Funde."

          else

            git commit -m "🐦‍⬛ Herold: neue Funde"

            git push

          fi
